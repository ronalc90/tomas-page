name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Calidad y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tomas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/tomas_test
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tomas_e2e
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas unitarias y de API (con PostgreSQL)
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Crear la base de pruebas end-to-end
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE tomas_e2e;"

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Pruebas end-to-end
        run: npm run e2e

      - name: Guardar el reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Construir la imagen de producción
        run: docker build --tag tomas-page:${{ github.sha }} .
      - name: Arrancar la imagen contra PostgreSQL y probar la salud
        run: |
          docker network create ci
          docker run -d --name db --network ci -e POSTGRES_PASSWORD=postgres postgres:16
          for i in $(seq 1 30); do docker exec db pg_isready -U postgres && break; sleep 1; done
          docker run -d --name app --network ci -p 3000:3000 \
            -e DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres \
            -e SEED_ADMIN_PASSWORD=ci-admin-password -e SEED_STUDENT_PASSWORD=1234 \
            tomas-page:${{ github.sha }}
          for i in $(seq 1 30); do
            # La salud incluye el motor de SQL de los ejercicios (sql.js + tienda.sql).
            if curl -fsS localhost:3000/api/health | tee /dev/stderr | grep -q '"sql":"ok"'; then exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1

  # La versión sin servidor ya no existe: el progreso vive solo en el backend. La variable APP_URL (o la dirección de Railway por defecto)
  # indica a dónde; GitHub Pages publica una página mínima que lleva a la app (también desde enlaces viejos).
  pages-redirect:
    name: GitHub Pages redirige a la app
    needs: [verify]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Crear la página que redirige
        env:
          APP_URL: ${{ vars.APP_URL || 'https://tomas-page-production.up.railway.app' }}
          REPO: ${{ github.event.repository.name }}
        run: |
          mkdir -p redirect
          python3 - <<'PY'
          import html, json, os
          url = os.environ["APP_URL"].rstrip("/") + "/"
          repo = os.environ["REPO"]
          page = rf"""<!doctype html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>El plan se mudó</title>
            <meta http-equiv="refresh" content="0; url={html.escape(url)}">
            <link rel="canonical" href="{html.escape(url)}">
            <style>
              body {{ font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #f3f5f7; color: #16202b; }}
              main {{ max-width: 32rem; padding: 2rem; text-align: center; }}
              a {{ color: #1d6b59; font-weight: 700; overflow-wrap: anywhere; }}
              @media (prefers-color-scheme: dark) {{ body {{ background: #0f151c; color: #e4eaf0; }} a {{ color: #4cb597; }} }}
            </style>
          </head>
          <body>
            <main>
              <h1>El plan se mudó</h1>
              <p>El plan se mudó a <a id="destino" href="{html.escape(url)}">{html.escape(url)}</a>. Tu avance está guardado allá.</p>
            </main>
            <script>
              // Conserva la ruta de los enlaces viejos: /{repo}/dia/2026-10-13 → APP_URL/dia/2026-10-13
              var base = {json.dumps(url)};
              var path = location.pathname.replace(new RegExp("^/" + {json.dumps(repo)} + "/?"), "").replace(/^\//, "");
              var destino = base + path + location.search + location.hash;
              document.getElementById("destino").href = destino;
              location.replace(destino);
            </script>
          </body>
          </html>
          """
          open("redirect/index.html", "w", encoding="utf-8").write(page)
          PY
          cp redirect/index.html redirect/404.html

      - name: Preparar la publicación
        uses: actions/upload-pages-artifact@v5
        with:
          path: redirect

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verificar que la página responde
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "${{ steps.deployment.outputs.page_url }}" | grep -q "El plan se mudó"; then
              echo "Página en línea: ${{ steps.deployment.outputs.page_url }}"
              exit 0
            fi
            sleep 6
          done
          exit 1

  # Despliega en cada push a main (o a mano). Necesita el secreto RAILWAY_TOKEN en el entorno production.
  deploy:
    name: Desplegar en Railway
    needs: [verify, docker]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # El secreto RAILWAY_TOKEN vive en el entorno production; el servicio se llama tomas-page salvo que la variable diga otra cosa.
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE || 'tomas-page' }}
    environment:
      name: production
      url: ${{ vars.APP_URL || 'https://tomas-page-production.up.railway.app' }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Marcar la versión
        run: echo "${GITHUB_SHA::7}" > VERSION

      - name: Instalar Railway CLI
        run: npm install -g @railway/cli

      - name: Desplegar
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --service "$RAILWAY_SERVICE" --environment production

      - name: Dirección pública
        id: url
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          APP_URL: ${{ vars.APP_URL || 'https://tomas-page-production.up.railway.app' }}
        run: |
          # Si todavía no hay APP_URL, Railway genera (o devuelve) el dominio público del servicio.
          url="$APP_URL"
          if [ -z "$url" ]; then
            out=$(railway domain --service "$RAILWAY_SERVICE" --environment production 2>&1 || true)
            echo "$out"
            url=$(echo "$out" | grep -oE 'https://[A-Za-z0-9.-]+\.up\.railway\.app' | head -1)
            if [ -n "$url" ]; then
              echo "::notice title=Dirección de la app::$url (guárdala en GitHub como variable APP_URL)"
            fi
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verificar que la versión nueva responde
        if: steps.url.outputs.url != ''
        env:
          APP_URL: ${{ steps.url.outputs.url }}
        run: |
          expected="${GITHUB_SHA::7}"
          for i in $(seq 1 40); do
            body=$(curl -fsS "$APP_URL/api/health" || true)
            echo "$body"
            if echo "$body" | grep -q "\"version\":\"$expected\""; then
              echo "Versión $expected en línea en $APP_URL"
              exit 0
            fi
            sleep 15
          done
          echo "La versión $expected no respondió a tiempo."
          exit 1
